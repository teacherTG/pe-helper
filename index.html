      try { await navigator.clipboard.writeText(text); toast(`${st.name} 세특을 복사했어요.`); }
      catch { S.sheet = { type: "copy", text }; render(); const b = $("#copybox"); if (b) { b.focus(); b.select(); } }
      break;
    }
    case "rm-copyall": {
      const text = (c.students || []).map(s => [s.no, s.name, remarkOf(c, s).text].join("\t")).join("\n");
      try { await navigator.clipboard.writeText(text); toast("반 전체를 복사했어요. 엑셀에 붙여넣으면 번호, 이름, 세특 열로 들어가요."); }
      catch { S.sheet = { type: "copy", text }; render(); const b = $("#copybox"); if (b) { b.focus(); b.select(); } }
      break;
    }
    case "cls": S.ui.cls = t.dataset.id; saveUI(); render(); break;
    case "ev": S.ui.ev[c.grade] = t.dataset.id; saveUI(); render(); break;
    case "item": S.ui.item[ev.id] = t.dataset.id; saveUI(); render(); window.scrollTo({ top: 0 }); break;
    case "add": S.sheet = { type: "class", grade: c ? c.grade : 1, num: 1, text: "" }; render(); break;
    case "manage": S.sheet = { type: "manage" }; render(); break;
    case "editcls": S.sheet = { type: "class", id: c.id, grade: c.grade, num: c.num, text: (c.students || []).map(s => [s.no, s.name, s.sex || ""].join("\t").trim()).join("\n") }; render(); break;
    case "close": S.sheet = null; render(); break;
    case "open": S.sheet = { type: "student", sid: t.dataset.sid }; render(); break;
    case "nav": {
      const studs = c.students || []; const i = studs.findIndex(x => x.id === S.sheet.sid) + +t.dataset.d;
      if (studs[i]) { S.sheet.sid = studs[i].id; render(); $(".sh-body") && ($(".sh-body").scrollTop = 0); }
      break;
    }
    case "lv": {
      const en = entryOf(c, st.id, ev); const old = en && en.items && en.items[item.id];
      const p = +t.dataset.p;
      setItem(c, st.id, ev, item.id, old && old.pts === p ? null : { pts: p });
      render(); break;
    }
    case "rawbtn": {
      const en = entryOf(c, st.id, ev); const old = en && en.items && en.items[item.id];
      const v = +t.dataset.v;
      if (old && !old.manual && old.raw === v) setItem(c, st.id, ev, item.id, null);
      else { const patch = { raw: v }; if (item.variants) patch.v = varOf(item, old).id; setItem(c, st.id, ev, item.id, patch); }
      render(); break;
    }
    case "manual": {
      const en = entryOf(c, st.id, ev); const old = en && en.items && en.items[item.id];
      const p = +t.dataset.p;
      setItem(c, st.id, ev, item.id, old && old.manual && old.pts === p ? null : { pts: p, manual: true, ...(old && old.v ? { v: old.v } : {}) });
      render(); break;
    }
    case "mk": case "mkadd": case "mkundo": case "mkfill": {
      const en = entryOf(c, st.id, ev); const old = en && en.items && en.items[item.id];
      const ts = trialStat(item, old && !old.manual ? old : null);
      const m = ts.marks.slice();
      if (act === "mk") { const k = +t.dataset.k; m[k] = m[k] === null ? 1 : m[k] === 1 ? 0 : null; }
      else if (act === "mkadd") {
        const k = m.indexOf(null);
        if (k < 0) { toast(`${st.name}: ${ts.n}칸을 모두 기록했어요. 칸을 눌러 고칠 수 있어요.`); break; }
        m[k] = +t.dataset.v;
      }
      else if (act === "mkundo") { for (let k = m.length - 1; k >= 0; k--) if (m[k] !== null) { m[k] = null; break; } }
      else { for (let k = 0; k < m.length; k++) if (m[k] === null) m[k] = 0; }
      if (m.every(x => x === null)) setItem(c, st.id, ev, item.id, item.variants && old && old.v ? { v: old.v } : null);
      else { const patch = { marks: m }; if (item.variants) patch.v = varOf(item, old).id; setItem(c, st.id, ev, item.id, patch); }
      render(); break;
    }
    case "clear": setItem(c, st.id, ev, item.id, null); render(); break;
    case "rowvar": {
      const en = entryOf(c, st.id, ev); const old = (en && en.items && en.items[item.id]) || {};
      setItem(c, st.id, ev, item.id, { ...old, v: t.dataset.v });
      render(); break;
    }
    case "defvar": S.ui.variant[item.id] = t.dataset.v; saveUI(); render(); break;
    case "sex": st.sex = st.sex === "남" ? "여" : "남"; persist(c.id); render(); toast(`${st.name}: ${st.sex}학생으로 설정했어요. 다시 누르면 바뀌어요.`); break;
    case "setsex": st.sex = t.dataset.v; persist(c.id); render(); break;
    case "savecls": saveClass(); break;
    case "delcls": S.sheet = { type: "confirm", title: `${c.name} 삭제`, body: `${c.name}의 명렬표와 입력한 점수가 모두 지워집니다. 되돌릴 수 없어요.`, yes: "삭제", run: () => { removeClass(c.id); S.ui.cls = null; saveUI(); toast("반을 삭제했어요."); } }; render(); break;
    case "confirm-yes": { const run = S.sheet.run; S.sheet = null; run && run(); render(); break; }
    case "sample": makeSample(); break;
    case "export-csv": exportCSV([c], `${c.name} 수행평가.csv`); break;
    case "export-all": exportCSV(sortedClasses(), `체육 수행평가 전체.csv`); break;
    case "backup": saveFile(`체육수행평가-백업-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ app: "pe-grader", v: 2, saved: new Date().toISOString(), classes: sortedClasses(), tasks: S.tasks }, null, 1)); break;
    case "copy-tsv": {
      const [h, rows] = tableRows(c);
      const text = [h, ...rows].map(r => r.join("\t")).join("\n");
      try { await navigator.clipboard.writeText(text); toast("표를 복사했어요. 엑셀에 붙여넣으세요."); }
      catch { S.sheet = { type: "copy", text }; render(); const b = $("#copybox"); if (b) { b.focus(); b.select(); } }
      break;
    }
  }
});

function saveClass() {
  const s = S.sheet;
  const grade = +($("#f-grade") ? $("#f-grade").value : s.grade);
  const num = +($("#f-num") ? $("#f-num").value : s.num);
  const text = $("#f-text") ? $("#f-text").value : s.text;
  const list = parseRoster(text);
  if (!list.length) { toast("명렬표에서 학생 이름을 찾지 못했어요."); return; }
  const name = `${grade}학년 ${num}반`;
  const dup = Object.values(S.classes).find(k => k.name === name && k.id !== s.id);
  if (dup) { toast(`${name}은(는) 이미 있어요. 그 반의 명렬표를 수정하세요.`); return; }
  if (s.id && S.classes[s.id]) {
    const c = S.classes[s.id];
    const old = c.students || [];
    const students = list.map(x => {
      const m = old.find(o => o.no === x.no && o.name === x.name) || old.find(o => o.name === x.name);
      return { id: m ? m.id : rid(), no: x.no, name: x.name, sex: x.sex || (m && m.sex) || null };
    });
    const keep = new Set(students.map(x => x.id));
    for (const k of Object.keys(c.scores || {})) if (!keep.has(k)) delete c.scores[k];
    Object.assign(c, { students, num, name, updated: Date.now() });
    persist(c.id); toast("명렬표를 저장했어요.");
  } else {
    const id = "c" + rid();
    S.classes[id] = { id, grade, num, name, students: list.map(x => ({ id: rid(), no: x.no, name: x.name, sex: x.sex || null })), scores: {}, created: Date.now(), updated: Date.now() };
    S.ui.cls = id; saveUI(); persist(id); toast(`${name}을(를) 만들었어요.`);
  }
  S.sheet = null; render();
}

function makeSample() {
  const names = ["예시학생가", "예시학생나", "예시학생다", "예시학생라", "예시학생마", "예시학생바"];
  const id = "c" + rid();
  const c = { id, grade: 1, num: 0, name: "예시 1학년", students: names.map((n, i) => ({ id: rid(), no: i + 1, name: n, sex: i % 2 ? "여" : "남" })), scores: {}, created: Date.now(), sample: true };
  const ev = EVALS[1][0];
  const demo = [[9, 27.4, 76, 6], [8, 30.2, 70, 4], [10, 33.9, 64, 6], [6, null, null, null]];
  demo.forEach((d, i) => {
    const sid = c.students[i].id;
    c.scores[sid] = { [ev.id]: { items: {} } };
    const it = c.scores[sid][ev.id].items;
    if (d[0] != null) it.und = { raw: d[0] };
    if (d[1] != null) it.zero = { raw: d[1] };
    if (d[2] != null) it.rec = { raw: d[2] };
    if (d[3] != null) it.att = { pts: d[3] };
  });
  [[1, 1, 0, 1, 1, 1], [1, 0, 1, null, null, null]].forEach((marks, i) => {
    c.scores[c.students[i].id][EVALS[1][1].id] = { items: { fore: { marks } } };
  });
  S.classes[id] = c; S.ui.cls = id; saveUI(); persist(id);
  toast("예시 반을 만들었어요. 반 관리에서 지울 수 있어요."); render();
}

// 구글 시트 모드: 다른 기기에서 입력한 내용을 앱으로 돌아올 때 다시 불러옴
document.addEventListener("visibilitychange", async () => {
  if (S.mode !== "sheet" || document.hidden || S.dirty.size || S.saving || S.sheet) return;
  try { await sheetLoad(); render(); } catch {}
});

render();
initStore();
})();
</script>
