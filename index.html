<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>당하중학교 체육 도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky control deck (반 → 평가 → 채점요소) over a roster that is one tap-row per student; detail opens as a bottom sheet. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --sunk:#E6ECE9; --ink:#14201B; --muted:#5A6A63; --line:#D5DDD9;
  --accent:#1E5A96; --accent-soft:#DCE8F5; --accent-ink:#FFFFFF;
  --good:#23794A; --good-soft:#DDF0E4; --warn:#9A5B00; --warn-soft:#FBEBD2; --bad:#B3261E; --bad-soft:#F9DEDC;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 8px 24px rgba(20,32,27,.08);
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2723; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3632;
  --accent:#86B6EA; --accent-soft:#1D3047; --accent-ink:#0E1412;
  --good:#71CF98; --good-soft:#173324; --warn:#F0B661; --warn-soft:#3A2A10; --bad:#F2918A; --bad-soft:#3D1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#1D2723; --ink:#E4ECE8; --muted:#93A39C; --line:#2A3632;
  --accent:#86B6EA; --accent-soft:#1D3047; --accent-ink:#0E1412;
  --good:#71CF98; --good-soft:#173324; --warn:#F0B661; --warn-soft:#3A2A10; --bad:#F2918A; --bad-soft:#3D1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

/* control deck */
.deck{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.site-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 16px}
.site-title{margin:0;font-family:var(--f-display);font-size:clamp(24px,4vw,30px);line-height:1.25;color:var(--accent)}
.site-cheer{margin:0;font-size:14px;line-height:1.6;color:var(--muted);word-break:keep-all}
.site-cheer span{display:inline-block}
.topline{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.01em;line-height:1;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
button.pill{border:0;cursor:pointer;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pill.busy{background:var(--warn-soft);color:var(--warn)}
.pill.err{background:var(--bad-soft);color:var(--bad)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;padding:0 12px;font-size:13px;font-weight:600;white-space:nowrap}

.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.add{border-style:dashed;color:var(--muted);font-weight:500}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 8px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.25;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg b{display:block;font-size:11px;font-weight:500;letter-spacing:.04em}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;border-bottom:3px solid transparent;padding:6px 10px 5px;font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab .mx{font-family:var(--f-num);font-size:11px;margin-left:3px;opacity:.8}

/* rubric card */
.rubric{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.rubric h2{margin:0;font-size:16px;font-weight:700;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rubric h2 .num{font-size:13px;color:var(--muted);font-weight:500}
.rubric p{margin:0;color:var(--muted);font-size:13px}
.rtable{display:flex;flex-wrap:wrap;gap:6px}
.rrow{display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:8px;padding:4px 4px 4px 9px;font-size:12.5px}
.rrow b{font-family:var(--f-num);background:var(--surface);border-radius:6px;padding:1px 7px;font-size:12.5px}
.rubric .opts{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}

.progress{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;font-size:13px;color:var(--muted);gap:8px;flex-wrap:wrap}
.bar{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden;flex:1;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}

/* roster rows */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto 50px;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
.row.absent{background:repeating-linear-gradient(-45deg,transparent 0 8px,var(--sunk) 8px 16px)}
.row .no{font-family:var(--f-num);color:var(--muted);font-size:14px;text-align:right}
.who{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:transparent;text-align:left;padding:0}
.who .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.who .sub{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.raw{width:92px;height:42px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;text-align:right;font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums}
.raw:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.raw.bad{border-color:var(--bad);background:var(--bad-soft)}
.unit{font-size:12px;color:var(--muted);margin-left:-2px}
.lv{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;height:42px;min-width:42px;font-family:var(--f-num);font-weight:600;font-size:16px}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:7px;font-size:12px;padding:2px 7px;font-weight:600;color:var(--muted)}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini.need{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.pts{justify-self:end;width:46px;height:42px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:18px;background:var(--sunk);color:var(--muted)}
.pts.on{background:var(--accent-soft);color:var(--accent)}
.pts.full{background:var(--accent);color:var(--accent-ink)}
.pts.abs{font-family:var(--f-body);font-size:11px;font-weight:700;background:var(--warn-soft);color:var(--warn)}

/* attempt checks (○/×) */
.row.t{row-gap:8px;padding-block:10px}
.row.t .tline{grid-column:1 / -1;display:flex;flex-direction:column;gap:6px;min-width:0}
.vline{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.trials{display:flex;flex-wrap:wrap;gap:6px 10px}
.tg{display:flex;flex-direction:column;gap:3px;flex:1 1 auto;min-width:0}
.tgl{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.tcells{display:grid;grid-template-columns:repeat(var(--cols),minmax(24px,1fr));gap:4px}
.tc{height:36px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font-family:var(--f-num);font-size:11px;color:var(--muted);padding:0;display:grid;place-items:center}
.tc.next{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.tc.s{background:var(--good-soft);border-color:var(--good);color:var(--good);font-size:19px;font-weight:700}
.tc.f{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-size:19px;font-weight:700}
.trials.big .tc{height:48px;border-radius:10px;font-size:13px}
.trials.big .tc.s,.trials.big .tc.f{font-size:24px}
.qb{height:42px;min-width:42px;border-radius:10px;border:1.5px solid;font-size:20px;font-weight:700;padding:0 10px}
.qb.s{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.qb.f{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.qbig{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qbig .qb{height:56px;font-size:18px}
.tstat{display:flex;gap:14px;font-size:14px;align-items:baseline}
.tstat b{font-size:18px}
.ptsrow button:disabled{opacity:.4}

/* top navigation */
.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;flex:1;min-width:0;background:var(--sunk);border-radius:12px;padding:3px}
.nav button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* tasks */
.tform{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.tform textarea{min-height:64px;font-family:var(--f-body);font-size:15px}
.tform .two input,.field input[type=date]{border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;width:100%;min-width:0;font-size:15px}
.tform .foot{display:flex;justify-content:flex-end}
.subtabs{display:flex;gap:6px;margin:18px 0 8px}
.subtabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.subtabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.subtabs .num{font-size:12px;margin-left:4px}
.task{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--good)}
.task .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.task .txt{white-space:pre-wrap;word-break:break-word;font-size:15px}
.task.done .txt{color:var(--muted);text-decoration:line-through}
.task .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.dday{font-family:var(--f-num);font-weight:600;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.dday.soon{background:var(--warn-soft);color:var(--warn)}
.dday.over{background:var(--bad-soft);color:var(--bad)}
.dday.ok{background:var(--good-soft);color:var(--good)}
.task .tools{display:flex;gap:4px}

/* subject remarks */
.rmcards{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.rm{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.rm .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rm .hd .nm{font-weight:700;font-size:16px}
.rm .hd .no{font-family:var(--f-num);color:var(--muted);font-size:13px;min-width:22px}
.scores{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.sc{font-size:12px;background:var(--sunk);border-radius:8px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.sc b{font-family:var(--f-num);color:var(--ink);font-size:13px}
.rm textarea{min-height:120px;font-family:var(--f-body);font-size:14.5px;line-height:1.7;background:var(--bg)}
.rm .ft{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rm .ft .cnt{font-size:12px;color:var(--muted);flex:1;min-width:0}
.rm .ft .cnt.over{color:var(--bad);font-weight:600}
.rm .ft .cnt.warn{color:var(--warn);font-weight:600}
.rm textarea.memo{min-height:56px;background:var(--surface);border-style:dashed}
.rm .field label{font-size:12px;color:var(--muted)}
.memost{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.memost .hint{font-size:12px;color:var(--muted)}
.memost .hint.ai{color:var(--accent);font-weight:600}
.memost .hint.busy{color:var(--warn)}
.memost .hint.err{color:var(--bad);font-weight:600}
.rm .ft .btn{padding:8px 12px;font-size:13px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.note-box{margin-top:14px;font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}

/* summary table */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk);position:sticky;top:0}
td.l,th.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td .dash{color:var(--line)}
.grade{display:inline-block;min-width:26px;border-radius:6px;padding:1px 6px;font-weight:700;font-family:var(--f-num)}
.grade.A{background:var(--good-soft);color:var(--good)}
.grade.B{background:var(--accent-soft);color:var(--accent)}
.grade.C{background:var(--warn-soft);color:var(--warn)}
.tot{font-weight:700}

.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}

/* empty */
.empty{margin-top:28px;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.empty ol{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head h3{margin:0;font-size:18px;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sh-head h3 .num{color:var(--muted);font-size:14px}
.sh-body{overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.sh-foot{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);align-items:center}
.sh-foot .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card .ttl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .ttl strong{font-size:15px}
.card .ttl .note{font-size:12px;color:var(--muted)}
.grid-btn{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.grid-btn button{height:46px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-family:var(--f-num);font-size:17px;font-weight:600}
.grid-btn button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ptsrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ptsrow .lab{font-size:12px;color:var(--muted);margin-right:2px}
.ptsrow button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:4px 10px;font-family:var(--f-num);font-weight:600;font-size:14px}
.ptsrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bigtotal{display:flex;align-items:baseline;gap:6px;font-family:var(--f-num);font-weight:600}
.bigtotal b{font-size:28px}
.bigtotal span{color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
textarea,select,.txt{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:15px;width:100%}
textarea{min-height:180px;font-family:var(--f-num);font-size:14px;line-height:1.55;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{font-size:13px;color:var(--muted)}
.preview b{color:var(--ink)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--warn)}
.copybox{font-family:var(--f-num);font-size:12px;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.sec-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:4px 2px -4px}
@media (max-width:420px){

<script>
(() => {
"use strict";

/* ───────── 평가 기준 (2026학년도 2학기 체육과 평가운영 계획) ───────── */
const atLeast = (list, floor) => r => { for (const [t, p] of list) if (r >= t) return p; return floor; };
const atMost  = (list, floor) => r => { r = Math.round(r * 100) / 100; for (const [t, p] of list) if (r <= t) return p; return floor; };

const UND10 = {
  id: "und", name: "체력 증진·관리·운동처방 이해", short: "이해", max: 10, kind: "num", unit: "점", rawMax: 10, buttons: true,
  desc: "내용 이해 평가(10점 만점) 득점을 입력하세요.",
  rule: atLeast([[9, 10], [7, 7]], 4),
  table: () => [["9점 이상", 10], ["7~8점", 7], ["6점 이하", 4]],
};
const discThrow = (id, name) => ({
  id, name, short: name, max: 17, kind: "num", unit: "개", rawMax: 6, buttons: true, trials: 6,
  groups: ctx => (ctx.sex === "여" ? ["5m", "6m", "7m"] : ctx.sex === "남" ? ["6m", "7m", "8m"] : ["1거리", "2거리", "3거리"]).map(label => ({ label, n: 2 })),
  desc: "거리별 2번씩 총 6번 — 넣으면 ○, 못 넣으면 × (남 6·7·8m / 여 5·6·7m)",
  rule: atLeast([[5, 17], [4, 14], [3, 11], [2, 8]], 5),
  table: () => [["5개 이상", 17], ["4개", 14], ["3개", 11], ["2개", 8], ["1개 이하", 5]],
});

const EVALS = {
  1: [
    { id: "g1a", tag: "수행1", name: "체력운동과 레이저 사격", max: 50, base: 16, items: [
      UND10,
      { id: "zero", name: "영점 사격", short: "영점", max: 17, kind: "num", unit: "초", decimal: true, time: true,
        desc: "흑점 5번을 맞추는 데 걸린 시간 (양손·한손 중 선택 자세)",
        rule: atMost([[28, 17], [31, 14], [34, 11], [37, 8]], 5),
        table: () => [["28.00초 이하", 17], ["28.01~31.00초", 14], ["31.01~34.00초", 11], ["34.01~37.00초", 8], ["37.01초 이상", 5]] },
      { id: "rec", name: "기록 사격", short: "기록", max: 17, kind: "num", unit: "점",
        desc: "기록 사격 점수 (양손·한손 중 선택 자세)",
        rule: atLeast([[75, 17], [71, 14], [67, 11], [63, 8]], 5),
        table: () => [["75점 이상", 17], ["71~74점", 14], ["67~70점", 11], ["63~66점", 8], ["62점 이하", 5]] },
      { id: "att", name: "수업 참여 태도", short: "태도", max: 6, kind: "level",
        desc: "스포츠의 연습과 경기 과정에서 인내심과 도전",
        levels: [[6, "꾸준히 인내하며 적극 도전"], [4, "인내심을 갖고 적극 도전"], [2, "참여하려고 노력"]] },
    ]},
    { id: "g1b", tag: "수행2", name: "생활환경형 스포츠 · 플라잉디스크", max: 50, base: 16, items: [
      { ...UND10, name: "플라잉디스크 역사·특성 이해" },
      discThrow("fore", "포핸드"),
      discThrow("back", "백핸드"),
      { id: "att", name: "수업 참여 태도", short: "태도", max: 6, kind: "level",
        desc: "스포츠 환경 친화적 태도와 공동체 의식",
        levels: [[6, "공동체 의식 적극 발휘"], [4, "공동체 의식 발휘"], [2, "발휘하려고 노력"]] },
    ]},
  ],
  2: [
    { id: "g2a", tag: "수행1", name: "신체건강활동 · 플레이트야구", max: 60, base: 15, items: [
      { id: "und", name: "플레이트야구 이해력", short: "이해", max: 20, kind: "num", unit: "점", rawMax: 20,
        desc: "경기 규칙 및 전략 이해력 평가(20점 만점) 득점",
        rule: atLeast([[20, 20], [17, 17], [14, 14], [10, 11], [6, 8]], 5),
        table: () => [["20점", 20], ["17~19점", 17], ["14~16점", 14], ["10~13점", 11], ["6~9점", 8], ["5점 이하", 5]] },
      { id: "hit", name: "타격의 정확성", short: "타격", max: 20, kind: "num", unit: "회", rawMax: 10, buttons: true, trials: 10,
        variants: [
          { id: "racket", label: "라켓", desc: "테니스 라켓 10회 — 공을 바운드시키지 않고 목표물을 넘기면 ○",
            rule: atLeast([[8, 20], [7, 17], [6, 14], [5, 11], [4, 8]], 5),
            table: [["8회 이상", 20], ["7회", 17], ["6회", 14], ["5회", 11], ["4회", 8], ["3회 이하", 5]] },
          { id: "bat", label: "배트", desc: "야구 배트 10회 — 타격한 공이 목표 구역에 도달하면 ○",
            rule: atLeast([[5, 20], [4, 17], [3, 14], [2, 11], [1, 8]], 5),
            table: [["5회 이상", 20], ["4회", 17], ["3회", 14], ["2회", 11], ["1회", 8], ["0회", 5]] },
        ] },
      { id: "skill", name: "야구기능 종합평가", short: "종합", max: 20, kind: "num", unit: "초", decimal: true, time: true, bySex: true,
        desc: "기록 시간 — 52.3 또는 1:04.5 처럼 입력",
        rule: (r, ctx) => ctx.sex === "여"
          ? atMost([[60, 20], [65, 17], [70, 14], [75, 11], [80, 8]], 5)(r)
          : atMost([[45, 20], [50, 17], [55, 14], [65, 11], [75, 8]], 5)(r),
        table: ctx => ctx.sex === "여"
          ? [["1:00 이내", 20], ["1:00.01~1:05", 17], ["1:05.01~1:10", 14], ["1:10.01~1:15", 11], ["1:15.01~1:20", 8], ["1:20.01 이상", 5]]
          : [["45초 이내", 20], ["45.01~50초", 17], ["50.01~55초", 14], ["55.01~65초", 11], ["65.01~75초", 8], ["75.01초 이상", 5]] },
    ]},
    { id: "g2b", tag: "수행2", name: "네트형 스포츠 · 탁구", max: 40, base: 10, items: [
      { id: "serve", name: "서브의 정확성", short: "서브", max: 20, kind: "num", unit: "개", rawMax: 9, buttons: true, trials: 9,
        desc: "서브 9개 — 목표 구역에 들어가면 ○, 아니면 ×",
        rule: atLeast([[8, 20], [7, 17], [6, 14], [5, 11], [4, 8]], 5),
        table: () => [["8개 이상", 20], ["7개", 17], ["6개", 14], ["5개", 11], ["4개", 8], ["3개 이하", 5]] },
      { id: "stroke", name: "스트로크의 정확성", short: "스트로크", max: 20, kind: "num", unit: "개", rawMax: 20, trials: 20,
        desc: "포핸드·백핸드 20개 — 목표 구역에 들어가면 ○, 아니면 ×",
        rule: atLeast([[16, 20], [13, 17], [10, 14], [7, 11], [4, 8]], 5),
        table: () => [["16개 이상", 20], ["13~15개", 17], ["10~12개", 14], ["7~9개", 11], ["4~6개", 8], ["3개 이하", 5]] },
    ]},
  ],
};
const GRADE_CUT = [[80, "A"], [60, "B"]];

function itemOptions(item) {
  if (item.kind === "level") return item.levels.map(l => l[0]);
  if (item.variants) return [...new Set(item.variants.flatMap(v => v.table.map(t => t[1])))].sort((a, b) => b - a);
  return [...new Set(item.table({ sex: "남" }).concat(item.table({ sex: "여" })).map(t => t[1]))].sort((a, b) => b - a);
}

/* ───────── 상태 ───────── */
const S = {
  loading: true, mode: "local", classes: {}, tasks: { items: [] },
  ui: { page: "eval", cls: null, ev: {}, item: {}, variant: {}, ttab: "open" },
  saving: 0, saveErr: null, dirty: new Set(), sheet: null,
};
const TASKS = "tasks";
const LS_DATA = "pe-grader-data-v1", LS_UI = "pe-grader-ui-v1", LS_TASKS = "pe-grader-tasks-v1";
const ls = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
};
Object.assign(S.ui, ls.get(LS_UI) || {});
const saveUI = () => ls.set(LS_UI, S.ui);

const rid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);

/* ───────── 저장소: 클라우드(db) 우선, 없으면 이 기기 ───────── */
let db = null, uid = null, coll = null;
const timers = {}, chains = {}, goneNames = {};

/* 구글 시트 모드: GitHub Pages 등 claude.ai 밖에서 열었을 때, Apps Script 웹 앱 API(주소 + 비밀 키)로 저장 */
const LS_API = "pe-grader-api-v1";
const apiCfg = () => { const c = ls.get(LS_API); return c && c.url && c.key ? c : null; };
const inClaude = () => !!(window.claude && typeof window.claude.use === "function");
async function apiCall(action, payload, cfg) {
  cfg = cfg || apiCfg();
  if (!cfg) throw new Error("구글 시트가 연결되지 않았어요.");
  let res;
  try {
    // text/plain으로 보내야 브라우저 사전 요청(CORS preflight) 없이 Apps Script에 닿음
    res = await fetch(cfg.url, { method: "POST", body: JSON.stringify({ key: cfg.key, action, ...(payload || {}) }) });
  } catch { throw new Error("구글 시트 서버에 연결하지 못했어요. 인터넷 연결과 웹 앱 주소를 확인하세요."); }
  let out; try { out = await res.json(); } catch { throw new Error("웹 앱 응답을 읽지 못했어요. 배포 시 액세스 권한이 ‘모든 사용자’인지 확인하세요."); }
  if (!out.ok) throw new Error(out.error === "unauthorized" ? "비밀 키가 맞지 않아요." : (out.error || "저장 서버 오류"));
  return out.data;
}
async function sheetLoad() {
  const docs = await apiCall("loadAll");
  const next = {}; let tasks = null;
  for (const d of docs || []) {
    let body; try { body = JSON.parse(d.json); } catch { continue; }
    if (d.id === TASKS) tasks = body; else if (body && body.grade) next[d.id] = body;
  }
  for (const id of Object.keys(next)) if (!S.dirty.has(id)) S.classes[id] = next[id];
  for (const id of Object.keys(S.classes)) if (!next[id] && !S.dirty.has(id)) delete S.classes[id];
  if (tasks && !S.dirty.has(TASKS)) S.tasks = { items: [], ...tasks };
}
// 시트에서 사람이 보기 좋은 표 (반별 점수와 세특, 업무 목록)
function sheetView(id) {
  if (id === TASKS) {
    const rows = (S.tasks.items || []).map(t => [t.date || "", t.due || "", t.text, t.done ? "완료" : "진행중", t.doneAt ? new Date(t.doneAt).toLocaleDateString("ko-KR") : ""]);
    return { name: "업무관리", rows: [["업무일자", "마감기한", "업무내용", "상태", "완료일"], ...rows] };
  }
  const c = S.classes[id]; if (!c) return null;
  ensureRemarks(c);
  const [h, rows] = tableRows(c);
  return { name: c.name, rows: [[...h, "관찰 메모", "교과세특"], ...rows.map((r, i) => { const st = c.students[i]; const rm = remarkOf(c, st); return [...r, rm.memo, rm.text]; })] };
}

async function initStore() {
  if (!inClaude() && apiCfg()) {
    S.mode = "sheet";
    try { await sheetLoad(); }
    catch (e) { S.saveErr = e.message || "구글 시트에서 불러오지 못했어요."; }
    S.loading = false; render();
    return;
  }
  try {
    if (window.claude && typeof window.claude.use === "function") {
      const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      const id = u ? await u.id() : null;
      if (d && id) { db = d; uid = id; }
    }
  } catch { db = null; }

  if (db) {
    S.mode = "cloud";
    coll = db.collection("data/users/" + uid);
    coll.onSnapshot(snap => {
      const next = {};
      let nextTasks = null;
      snap.docs.forEach(d => {
        if (!d.exists) return;
        const body = JSON.parse(JSON.stringify(d.data()));
        if (d.id === TASKS) nextTasks = body; else if (body && body.grade) next[d.id] = body;
      });
      let changed = S.loading;
      if (nextTasks && !S.dirty.has(TASKS) && JSON.stringify(S.tasks) !== JSON.stringify(nextTasks)) { S.tasks = { items: [], ...nextTasks }; changed = true; }
      for (const id of Object.keys(next)) {
        if (S.dirty.has(id)) continue;
        if (JSON.stringify(S.classes[id]) !== JSON.stringify(next[id])) { S.classes[id] = next[id]; changed = true; }
      }
      for (const id of Object.keys(S.classes)) if (!next[id] && !S.dirty.has(id) && !snap.metadata.hasPendingWrites) { delete S.classes[id]; changed = true; }
      S.loading = false;
      if (changed) render();
    }, () => { S.saveErr = "연결이 끊겼어요. 새로고침해 주세요."; render(); });
  } else {
    S.mode = "local";
    S.classes = ls.get(LS_DATA) || {};
    S.tasks = ls.get(LS_TASKS) || { items: [] };
    S.loading = false;
    render();
  }
}

function persist(id) {
  if (S.mode === "local") {
    if (!ls.set(LS_DATA, S.classes) || !ls.set(LS_TASKS, S.tasks)) S.saveErr = "이 기기에 저장하지 못했어요.";
    paintStatus(); return;
  }
  S.dirty.add(id);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), S.mode === "sheet" ? 1500 : 500);
  paintStatus();
}
function flush(id) {
  const body = id === TASKS ? S.tasks : S.classes[id];
  S.saving++; paintStatus();
  chains[id] = (chains[id] || Promise.resolve()).then(async () => {
    try {
      if (S.mode === "sheet") {
        if (body) { const view = sheetView(id); await apiCall("saveDoc", { id, json: JSON.stringify(body), view }); }
        else await apiCall("deleteDoc", { id, viewName: goneNames[id] || "" });
      } else if (body) await coll.doc(id).set(JSON.parse(JSON.stringify(body)));
      else await coll.doc(id).delete();
      S.saveErr = null;
    } catch (e) {
      S.saveErr = S.mode === "sheet" ? (e && e.message) || "구글 시트에 저장하지 못했어요." : e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요." : "저장하지 못했어요. 다시 시도해 주세요.";
    } finally {
      S.saving--;
      if (!timers[id] || S.saving === 0) S.dirty.delete(id);
      paintStatus();
    }
  });
  timers[id] = null;
}
function removeClass(id) {
  if (S.classes[id]) goneNames[id] = S.classes[id].name;
  delete S.classes[id];
  if (S.mode === "local") persist(id);
  else { S.dirty.add(id); flush(id); }
}

/* ───────── 계산 ───────── */
const cls = () => S.classes[S.ui.cls];
const evalsOf = c => EVALS[c.grade] || [];
const curEval = c => { const list = evalsOf(c); return list.find(e => e.id === S.ui.ev[c.grade]) || list[0]; };
const varOf = (item, entry) => item.variants ? item.variants.find(v => v.id === (entry && entry.v)) || item.variants.find(v => v.id === S.ui.variant[item.id]) || item.variants[0] : null;

function entryOf(c, sid, ev) { return (((c.scores || {})[sid] || {})[ev.id]) || null; }
function trialStat(item, e) {
  const n = item.trials;
  const marks = Array.from({ length: n }, (_, i) => (e && Array.isArray(e.marks) && (e.marks[i] === 0 || e.marks[i] === 1)) ? e.marks[i] : null);
  const succ = marks.filter(x => x === 1).length, fail = marks.filter(x => x === 0).length;
  return { n, marks, succ, fail, filled: succ + fail, done: succ + fail === n };
}
function itemPts(item, entry, stu) {
  const e = entry && entry.items && entry.items[item.id];
  if (!e) return null;
  if (e.pts != null && (e.manual || item.kind === "level")) return e.pts;
  let raw = e.raw;
  if (item.trials && Array.isArray(e.marks)) { const t = trialStat(item, e); raw = t.done ? t.succ : null; }
  if (raw == null) return null;
  if (item.bySex && !stu.sex) return null;
  if (item.variants) return varOf(item, e).rule(raw);
  return item.rule(raw, { sex: stu.sex });
}
function trialsHTML(item, e, stu, big) {
  const t = trialStat(item, e);
  const groups = item.groups ? item.groups({ sex: stu.sex }) : [{ label: "", n: t.n }];
  const next = t.marks.indexOf(null);
  let k = 0;
  return `<div class="trials${big ? " big" : ""}">` + groups.map(g => {
    const cols = Math.min(g.n, 10);
    let cells = "";
    for (let j = 0; j < g.n; j++, k++) {
      const m = t.marks[k];
      const cl = m === 1 ? "tc s" : m === 0 ? "tc f" : k === next ? "tc next" : "tc";
      const lab = m === 1 ? "○" : m === 0 ? "×" : k + 1;
      cells += `<button class="${cl}" data-act="mk" data-sid="${stu.id}" data-item="${item.id}" data-k="${k}" aria-label="${k + 1}번째 ${m === 1 ? "성공" : m === 0 ? "실패" : "미기록"}">${lab}</button>`;
    }
    return `<div class="tg">${g.label ? `<span class="tgl">${esc(g.label)}</span>` : ""}<div class="tcells" style="--cols:${cols}">${cells}</div></div>`;
  }).join("") + `</div>`;
}
function trialSub(item, e) {
  const t = trialStat(item, e);
  if (!t.filled) return e && e.raw != null && !e.marks ? `숫자 기록 ${e.raw}${item.unit}` : "";
  return `○ ${t.succ} · × ${t.fail}${t.done ? "" : ` · 남은 ${t.n - t.filled}`}`;
}
function evalTotal(c, stu, ev) {
  const en = entryOf(c, stu.id, ev);
  if (en && en.absent) return { total: ev.base - 1, done: true, absent: true, n: ev.items.length };
  let total = 0, n = 0;
  for (const it of ev.items) { const p = itemPts(it, en, stu); if (p != null) { total += p; n++; } }
  return { total, n, done: n === ev.items.length, absent: false };
}
function semester(c, stu) {
  const parts = evalsOf(c).map(ev => evalTotal(c, stu, ev));
  if (!parts.every(p => p.done)) return null;
  const total = parts.reduce((a, p) => a + p.total, 0);
  const grade = (GRADE_CUT.find(([cut]) => total >= cut) || [0, "C"])[1];
  return { total, grade };
}
function parseRaw(item, str) {
  str = String(str).trim().replace(/\s+/g, "");
  if (!str) return { empty: true };
  let v;
  if (item.time) {
    let m = str.match(/^(\d+)[:분'](\d+(?:\.\d+)?)초?"?$/);
    if (m) v = +m[1] * 60 + +m[2];
    else { m = str.match(/^(\d+(?:\.\d+)?)초?$/); if (m) v = +m[1]; }
  } else if (/^\d+(\.\d+)?$/.test(str)) v = +str;
  if (v == null || !isFinite(v)) return { err: "숫자를 입력하세요" };
  if (!item.decimal && !Number.isInteger(v)) return { err: "정수로 입력하세요" };
  if (item.rawMax != null && v > item.rawMax) return { err: `최대 ${item.rawMax}${item.unit}` };
  return { v };
}
const fmtRaw = (item, raw) => {
  if (raw == null) return "";
  if (item.time && raw >= 60 && item.bySex) { const m = Math.floor(raw / 60), s = +(raw - m * 60).toFixed(2); return `${m}:${s < 10 ? "0" : ""}${s}`; }
  return String(raw);
};

function setItem(c, sid, ev, itemId, patch) {
  c.scores = c.scores || {};
  const s = c.scores[sid] = c.scores[sid] || {};
  const en = s[ev.id] = s[ev.id] || { items: {} };
  en.items = en.items || {};
  if (patch === null) delete en.items[itemId];
  else en.items[itemId] = patch;
  c.updated = Date.now();
  persist(c.id);
}
function setAbsent(c, sid, ev, on) {
  c.scores = c.scores || {};
  const s = c.scores[sid] = c.scores[sid] || {};
  const en = s[ev.id] = s[ev.id] || { items: {} };
  if (on) en.absent = true; else delete en.absent;
  persist(c.id);
}

/* ───────── 그리기 ───────── */
function paintStatus() {
  const el = $("#status"); if (!el) return;
  let cls_ = "pill", txt;
  if (S.saveErr) { cls_ += " err"; txt = S.saveErr; }
  else if (S.mode === "local") { txt = inClaude() ? "이 기기에만 저장" : "이 기기에만 저장 · 시트 연결"; }
  else if (S.saving || S.dirty.size) { cls_ += " busy"; txt = "저장 중…"; }
  else { cls_ += " ok"; txt = S.mode === "sheet" ? "시트에 저장됨" : "저장됨"; }
  el.className = cls_; el.textContent = txt;
}

function sortedClasses() {
  return Object.values(S.classes).sort((a, b) => a.grade - b.grade || a.num - b.num || String(a.name).localeCompare(b.name));
}

function render() {
  const keep = document.activeElement && document.activeElement.id;
  const caret = keep && document.activeElement.selectionStart;
  const ae = document.activeElement;
  const typed = keep && (ae.tagName === "TEXTAREA" || (ae.tagName === "INPUT" && ae.type !== "checkbox" && ae.type !== "file")) ? ae.value : null;
  renderDeck(); renderMain(); renderLayer(); paintStatus();
  if (keep) { const el = document.getElementById(keep); if (el) { if (typed != null) el.value = typed; el.focus({ preventScroll: true }); try { if (caret != null) el.setSelectionRange(caret, caret); } catch {} } }
}

function renderDeck() {
  const list = sortedClasses();
  if (!S.classes[S.ui.cls] && list.length) S.ui.cls = list[0].id;
  const c = cls();
  const page = S.ui.page || "eval";
  const pages = [["tasks", "업무관리"], ["eval", "수행평가"], ["remarks", "교과세특"]];
  let h = `<div class="site-heading"><h1 class="site-title">당하중학교 체육 도우미</h1><p class="site-cheer"><span>체육교사 한태건 화이팅.</span> <span>발전하는 교사 한태건 화이팅</span></p></div><div class="topline"><nav class="nav" aria-label="메뉴">${pages.map(([id, l]) => `<button data-act="page" data-id="${id}" aria-pressed="${page === id}">${l}</button>`).join("")}</nav>${inClaude() ? `<span id="status" class="pill"></span>` : `<button id="status" class="pill" data-act="conn" title="구글 시트 연결 설정"></button>`}</div>`;
  if (page === "tasks") { $("#deck").innerHTML = h; return; }
  if (page === "remarks") {
    if (list.length) h += `<div class="scroller" role="toolbar" aria-label="반 선택">` + list.map(k => `<button class="chip" data-act="cls" data-id="${k.id}" aria-pressed="${k.id === S.ui.cls}">${esc(k.name)}</button>`).join("") + `</div>`;
    $("#deck").innerHTML = h; return;
  }
  if (list.length) {
    h += `<div class="scroller" role="toolbar" aria-label="반 선택">` +
      list.map(k => `<button class="chip" data-act="cls" data-id="${k.id}" aria-pressed="${k.id === S.ui.cls}">${esc(k.name)}</button>`).join("") +
      `<button class="chip add" data-act="add">+ 반 추가</button>${c ? `<button class="chip add" data-act="manage">반 관리</button>` : ""}</div>`;
  }
  if (c) {
    const ev = curEval(c);
    h += `<div class="seg">` + evalsOf(c).map(e =>
      `<button data-act="ev" data-id="${e.id}" aria-pressed="${e.id === ev.id}"><b>${e.tag} · ${e.max}점</b>${esc(e.name)}</button>`).join("") + `</div>`;
    const cur = S.ui.item[ev.id] || "sum";
    h += `<div class="tabs" role="toolbar" aria-label="채점 요소">` +
      `<button class="tab" data-act="item" data-id="sum" aria-pressed="${cur === "sum"}">결과표</button>` +
      ev.items.map(it => `<button class="tab" data-act="item" data-id="${it.id}" aria-pressed="${cur === it.id}">${esc(it.short)}<span class="mx">${it.max}</span></button>`).join("") +
      `</div>`;
  }
  $("#deck").innerHTML = h;
}

function renderMain() {
  const m = $("#main");
  if (S.loading) { m.innerHTML = `<div class="empty"><h2>불러오는 중…</h2><p>저장된 업무와 반, 점수를 가져오고 있어요.</p></div>`; return; }
  if (S.ui.page === "tasks") { m.innerHTML = tasksView(); return; }
  const c = cls();
  if (S.ui.page === "remarks") {
    m.innerHTML = c ? remarksView(c) : `<section class="empty"><h2>먼저 수행평가에서 반을 만들어 주세요</h2><p>명렬표와 수행평가 점수가 있으면 학생마다 세특 문장이 자동으로 만들어져요.</p><div class="actions"><button class="btn primary" data-act="page" data-id="eval">수행평가로 가기</button></div></section>`;

  }
  if (!c) {
    m.innerHTML = `<section class="empty">
      <h2>명렬표를 넣으면 평가표가 바로 만들어져요</h2>
      <p>1학년은 레이저 사격·플라잉디스크, 2학년은 플레이트야구·탁구 채점 기준이 들어 있어요. 기록(초, 개수, 점수)만 입력하면 평가계획서의 배점으로 바뀝니다.</p>
      <ol><li>반 추가 → 학년과 반 선택</li><li>엑셀 명렬표를 복사해 붙여넣기 (번호·이름·성별)</li><li>채점 요소를 고르고 학생별로 기록 입력</li></ol>
      <div class="actions"><button class="btn primary" data-act="add">반 추가</button><button class="btn" data-act="sample">예시 반 만들어 보기</button></div>
    </section>`;
    return;
  }
  const ev = curEval(c);
  const cur = S.ui.item[ev.id] || "sum";
  const item = ev.items.find(i => i.id === cur);
  m.innerHTML = item ? itemView(c, ev, item) : sumView(c, ev);
}

function rubricHTML(item, ctx) {
  if (item.kind === "level") return item.levels.map(([p, l]) => `<span class="rrow">${esc(l)}<b>${p}</b></span>`).join("");
  const rows = item.variants ? varOf(item, null).table : item.table(ctx);
  return rows.map(([l, p]) => `<span class="rrow">${esc(l)}<b>${p}</b></span>`).join("");
}

function itemView(c, ev, item) {
  const studs = c.students || [];
  let done = 0;
  const rows = studs.map(st => {
    const en = entryOf(c, st.id, ev);
    const e = en && en.items && en.items[item.id];
    const p = itemPts(item, en, st);
    if (en && en.absent) done++; else if (p != null) done++;
    return rowHTML(c, ev, item, st, en, e, p);
  }).join("");
  const v = item.variants ? varOf(item, null) : null;
  let opts = "";
  if (item.variants) opts = `<div class="opts">기본 도구 ${item.variants.map(x => `<button class="mini" data-act="defvar" data-item="${item.id}" data-v="${x.id}" aria-pressed="${x.id === v.id}">${x.label}</button>`).join("")}<span>· 학생마다 바꿀 수 있어요</span></div>`;
  let tables = "";
  if (item.bySex) tables = `<div class="opts"><b>남</b></div><div class="rtable">${rubricHTML(item, { sex: "남" })}</div><div class="opts"><b>여</b></div><div class="rtable">${rubricHTML(item, { sex: "여" })}</div>`;
  else tables = `<div class="rtable">${rubricHTML(item, {})}</div>`;
  const pct = studs.length ? Math.round(done / studs.length * 100) : 0;
  return `<section class="rubric" aria-label="채점 기준">
      <h2>${esc(item.name)} <span class="num">${item.max}점</span></h2>
      <p>${esc(v ? v.desc : item.desc)}</p>${opts}${tables}
    </section>
    <div class="progress"><span>입력 <b class="num">${done}</b> / <span class="num">${studs.length}</span>명</span><div class="bar"><i style="width:${pct}%"></i></div>
      <span>${item.trials ? "○/× 버튼은 다음 칸부터 채워요 · 칸을 누르면 ○→×→빈칸" : item.kind === "num" ? "입력 후 Enter → 다음 학생" : "점수를 누르면 저장"}</span></div>
    <div class="actions"><button class="btn" data-act="bulk-open" data-item="${item.id}" ${studs.length ? "" : "disabled"}>엑셀 결과 붙여넣기</button></div>
    <div class="list">${rows || `<div class="row"><span></span><span class="muted">학생이 없어요. 반 관리에서 명렬표를 넣어 주세요.</span></div>`}</div>`;
}

function rowHTML(c, ev, item, st, en, e, p) {
  const absent = en && en.absent;
  let sub = [];
  if (st.sex) sub.push(st.sex);
  let ctl = "", vline = "";
  if (absent) {
    ctl = `<span class="muted" style="font-size:13px">미응시 처리</span>`;
  } else if (item.kind === "level") {
    ctl = item.levels.map(([pt]) => `<button class="lv" data-act="lv" data-sid="${st.id}" data-item="${item.id}" data-p="${pt}" aria-pressed="${e && e.pts === pt}">${pt}</button>`).join("");
  } else {
    if (item.variants) {
      const v = varOf(item, e);
      const minis = item.variants.map(x => `<button class="mini" data-act="rowvar" data-sid="${st.id}" data-item="${item.id}" data-v="${x.id}" aria-pressed="${x.id === v.id}">${x.label}</button>`).join("");
      if (item.trials) vline = `<div class="vline">도구 ${minis}</div>`; else ctl += minis;
    }
    if (item.bySex) {
      ctl += st.sex ? "" : `<button class="mini need" data-act="sex" data-sid="${st.id}">성별?</button>`;
    }
    if (item.trials) {
      ctl += `<button class="qb s" data-act="mkadd" data-v="1" data-sid="${st.id}" data-item="${item.id}" aria-label="${esc(st.name)} 다음 칸 성공">○</button><button class="qb f" data-act="mkadd" data-v="0" data-sid="${st.id}" data-item="${item.id}" aria-label="${esc(st.name)} 다음 칸 실패">×</button>`;
    } else {
      const val = e && !e.manual ? fmtRaw(item, e.raw) : "";
      const ph = e && e.manual ? "직접" : item.unit;
      ctl += `<input class="raw" id="in-${st.id}" data-sid="${st.id}" data-item="${item.id}" value="${esc(val)}" placeholder="${ph}" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(st.name)} ${esc(item.name)} 기록">`;
    }
  }
  const trial = item.trials && !absent;
  if (trial) { const ts = trialSub(item, e); if (ts) sub.push(ts); }
  const ptsCls = absent ? "pts abs" : p == null ? "pts" : p === item.max ? "pts full" : "pts on";
  const ptsTxt = absent ? "미응시" : p == null ? "–" : p;
  return `<div class="row${absent ? " absent" : ""}${trial ? " t" : ""}">
    <span class="no">${esc(st.no)}</span>
    <button class="who" data-act="open" data-sid="${st.id}"><span class="nm">${esc(st.name)}</span><span class="sub">${sub.map(esc).join(" · ")}${e && e.manual ? `<span>직접 선택</span>` : ""}</span></button>
    <div class="ctl">${ctl}</div>
    <span class="${ptsCls}" id="pt-${st.id}">${ptsTxt}</span>
    ${trial ? `<div class="tline">${vline}${trialsHTML(item, e && !e.manual ? e : null, st, false)}</div>` : ""}
  </div>`;
}

function sumView(c, ev) {
  const studs = c.students || [];
  const other = evalsOf(c).filter(e => e.id !== ev.id);
  let complete = 0, sum = 0;
  const body = studs.map(st => {
    const en = entryOf(c, st.id, ev);
    const t = evalTotal(c, st, ev);
    const sem = semester(c, st);
    if (t.done) { complete++; sum += t.total; }
    const cells = ev.items.map(it => {
      if (t.absent) return `<td class="muted">·</td>`;
      const p = itemPts(it, en, st);
      return `<td class="num">${p == null ? `<span class="dash">–</span>` : p}</td>`;
    }).join("");
    const otherCells = other.map(o => { const ot = evalTotal(c, st, o); return `<td class="num">${ot.done ? ot.total : ot.n ? `<span class="muted">${ot.total}…</span>` : `<span class="dash">–</span>`}</td>`; }).join("");
    return `<tr data-act="open" data-sid="${st.id}">
      <td class="num muted">${esc(st.no)}</td><td class="l">${esc(st.name)}</td>${cells}
      <td class="num tot">${t.absent ? `${t.total}<small class="muted"> 미응시</small>` : t.done ? t.total : t.n ? `<span class="muted">${t.total}…</span>` : `<span class="dash">–</span>`}</td>
      ${otherCells}
      <td class="num">${sem ? sem.total : `<span class="dash">–</span>`}</td>
      <td>${sem ? `<span class="grade ${sem.grade}">${sem.grade}</span>` : `<span class="dash">–</span>`}</td></tr>`;
  }).join("");
  const avg = complete ? (sum / complete).toFixed(1) : "–";
  return `<div class="progress"><span>${esc(ev.tag)} 완료 <b class="num">${complete}</b> / <span class="num">${studs.length}</span>명 · 평균 <b class="num">${avg}</b>점</span>
      <span>이름을 누르면 학생별 채점 카드가 열려요</span></div>
    <div class="tblwrap"><table>
      <thead><tr><th>번호</th><th class="l">이름</th>${ev.items.map(it => `<th>${esc(it.short)}<br><span class="num">${it.max}</span></th>`).join("")}
      <th>${esc(ev.tag)}<br><span class="num">${ev.max}</span></th>${other.map(o => `<th>${esc(o.tag)}<br><span class="num">${o.max}</span></th>`).join("")}
      <th>학기<br><span class="num">100</span></th><th>성취도</th></tr></thead>
      <tbody>${body || `<tr><td colspan="9" class="muted">학생이 없어요.</td></tr>`}</tbody></table></div>
    <div class="actions">
      <button class="btn" data-act="bulk-open">엑셀 결과 붙여넣기</button>
      <button class="btn" data-act="export-csv">이 반 CSV 저장</button>
      <button class="btn" data-act="copy-tsv">표 복사 (엑셀 붙여넣기)</button>
    </div>
    <p class="muted" style="font-size:12px;margin-top:10px">성취도: 학기 합계 80점 이상 A · 60점 이상 B · 60점 미만 C. 미응시는 해당 영역 기본점수 −1점(${ev.base - 1}점)으로 계산해요.</p>`;
}

/* ───────── 업무관리 ───────── */
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => s ? `${+s.slice(5, 7)}월 ${+s.slice(8, 10)}일` : "";
function dday(due) {
  if (!due) return "";
  const d = Math.round((new Date(due + "T00:00") - new Date(today() + "T00:00")) / 86400000);
  if (d < 0) return `<span class="dday over">${-d}일 지남</span>`;
  if (d === 0) return `<span class="dday soon">오늘 마감</span>`;
  return `<span class="dday${d <= 3 ? " soon" : ""}">D-${d}</span>`;
}
function tasksView() {
  const items = S.tasks.items || [];
  const open = items.filter(t => !t.done).sort((a, b) => (a.due || "9999") .localeCompare(b.due || "9999") || (a.date || "").localeCompare(b.date || ""));
  const done = items.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const tab = S.ui.ttab === "done" ? "done" : "open";
  const list = tab === "done" ? done : open;
  const rows = list.map(t => `<div class="task${t.done ? " done" : ""}">
      <input type="checkbox" id="tk-${t.id}" data-tid="${t.id}" ${t.done ? "checked" : ""} aria-label="완료 표시">
      <div class="body"><div class="txt">${esc(t.text)}</div>
        <div class="meta">${t.date ? `<span>업무일 ${fmtDate(t.date)}</span>` : ""}${t.due ? `<span>마감 ${fmtDate(t.due)}</span>` : ""}${t.done ? `<span class="dday ok">${t.doneAt ? fmtDate(new Date(t.doneAt - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)) + " 완료" : "완료"}</span>` : dday(t.due)}</div></div>
      <div class="tools"><button class="mini" data-act="task-edit" data-tid="${t.id}">수정</button></div>
    </div>`).join("");
  return `<section class="tform" aria-label="업무 추가">
      <div class="two">
        <div class="field"><label for="t-date">업무일자</label><input type="date" id="t-date" value="${today()}"></div>
        <div class="field"><label for="t-due">마감기한</label><input type="date" id="t-due"></div>
      </div>
      <div class="field"><label for="t-text">업무내용</label><textarea id="t-text" placeholder="예: 2학년 탁구 수행평가 결과 NEIS 입력"></textarea></div>
      <div class="foot"><button class="btn primary" data-act="task-add">업무 추가</button></div>
    </section>
    <div class="subtabs" role="toolbar" aria-label="업무 상태">
      <button data-act="ttab" data-id="open" aria-pressed="${tab === "open"}">진행중<span class="num">${open.length}</span></button>
      <button data-act="ttab" data-id="done" aria-pressed="${tab === "done"}">완료<span class="num">${done.length}</span></button>
    </div>
    <div class="list">${rows || `<div class="task"><span></span><span class="muted">${tab === "done" ? "완료한 업무가 아직 없어요. 진행중 업무의 체크칸을 누르면 여기로 옮겨져요." : "진행중인 업무가 없어요. 위에서 업무를 추가하세요."}</span></div>`}</div>`;
}
function taskSheet(s) {

    <div class="sh-body">

        <div class="field"><label for="e-date">업무일자</label><input type="date" id="e-date" class="txt" value="${esc(t.date || "")}"></div>

/* ───────── 교과세특 ───────── */
// 기재요령: 체육 교과는 성취수준의 특성, 실기능력, 교과적성, 학습활동 참여도 및 태도를 문장으로 입력.
// 명사형 어미로 종결, 특수문자 지양. 자동 문장은 1,000Byte 안으로 맞춤(NEIS 한도 1,500Byte, 한글 3B, 영문·숫자·엔터 1B).
const RM_BYTES = 1000, RM_MAX_BYTES = 1500;
const PHR = {
  g1a: {
    intro: [

  if (isEdited(rm)) return { ...base, text: rm.text || "", edited: true, stale: !!rm.sig && rm.sig !== sigOf(c, st) };
  return { ...base, text: assemble(rm.parts, rm.memo), edited: false };
}

function memoStatus(st, r) {
  if (r.edited && r.memo.trim()) return `<span class="hint">직접 고친 문장에는 메모가 자동으로 들어가지 않아요. ‘다시 만들기’를 누르면 메모를 넣어 새로 만들어요.</span>`;
  return `<span class="hint">메모는 세특 끝맺음 문장 앞에 그대로 들어가요. ‘~함’, ‘~보임’처럼 명사형으로 적어 주세요.</span>`;
}
function countText(text) {
  const b = neisBytes(text);
  return { html: `${text.length}자 · ${b.toLocaleString()} / ${RM_BYTES.toLocaleString()}Byte`, cls: b > RM_MAX_BYTES ? "cnt over" : b > RM_BYTES ? "cnt warn" : "cnt" };
}
function scoreChips(c, st) {
  const parts = evalsOf(c).map(ev => {
    const t = evalTotal(c, st, ev);
    const v = t.absent ? `${t.total}<span class="muted"> 미응시</span>` : t.done ? t.total : t.n ? `${t.total}<span class="muted">…</span>` : "–";
    return `<span class="sc">${ev.tag} <b>${v}</b>/${ev.max}</span>`;
  });
  const sem = semester(c, st);
  if (sem) parts.push(`<span class="sc">합계 <b>${sem.total}</b> <span class="grade ${sem.grade}">${sem.grade}</span></span>`);
  return parts.join("");
}
function remarksView(c) {
  if (ensureRemarks(c)) persist(c.id);
  const studs = c.students || [];
  const texts = studs.map(st => remarkOf(c, st));
  const seen = new Map();
  texts.forEach(x => sentences(x.text).forEach(s => seen.set(s, (seen.get(s) || 0) + 1)));
  const allS = [...seen.values()].reduce((a, b) => a + b, 0);
  const dupS = [...seen.values()].filter(n => n > 1).reduce((a, b) => a + b, 0);
  const cards = studs.map((st, i) => {
    const { text, edited, stale, memo } = texts[i];
    const cnt = countText(text);
    return `<article class="rm">
      <div class="hd"><span class="no">${esc(st.no)}</span><span class="nm">${esc(st.name)}</span>${edited ? `<span class="tag">직접 수정</span>` : ""}${stale ? `<span class="tag">점수 바뀜</span>` : ""}<div class="scores">${scoreChips(c, st)}</div></div>
      <div class="field"><label for="mm-${st.id}">관찰 메모</label>
        <textarea class="memo" id="mm-${st.id}" data-sid="${st.id}" placeholder="예: 모둠 친구에게 서브 토스 요령을 알려 주며 함께 연습함">${esc(memo)}</textarea>
        <div class="memost" id="ms-${st.id}">${memoStatus(st, texts[i])}</div></div>
      <div class="field"><label for="rm-${st.id}">세부능력 및 특기사항</label>
      <textarea id="rm-${st.id}" data-sid="${st.id}" placeholder="수행평가 점수를 입력하면 문장이 만들어져요.">${esc(text)}</textarea></div>
      <div class="ft"><span class="${cnt.cls}" id="rc-${st.id}">${cnt.html}</span>
        <button class="btn" data-act="rm-regen" data-sid="${st.id}">다시 만들기</button>
        <button class="btn primary" data-act="rm-copy" data-sid="${st.id}">복사</button></div>
    </article>`;
  }).join("");
  const dupInfo = allS ? `겹치는 문장 ${Math.round(dupS / allS * 100)}%` : "";
  return `<div class="progress"><span>${esc(c.name)} · ${studs.length}명 · 과목: 체육${dupInfo ? ` · ${dupInfo}` : ""}</span><span class="actions" style="margin:0"><button class="btn" data-act="rm-regenall">반 전체 다시 만들기</button><button class="btn" data-act="rm-copyall">반 전체 복사</button></span></div>
    <div class="rmcards">${cards || `<p class="muted">학생이 없어요.</p>`}</div>
    <p class="note-box">문장은 수행평가 항목별 점수 수준(상·중·하)에 맞춰 평가계획의 성취기준을 바탕으로 만들고, 같은 반 학생끼리 가장 적게 쓰인 문장을 골라 겹침을 줄여요. 기재요령에 따라 명사형 어미로 끝내고 1,000Byte 안으로 맞춥니다(NEIS 한도 1,500Byte). 관찰 메모는 줄이지 않고 그대로 들어가요. 직접 고친 문장은 그대로 저장돼요. NEIS에 넣기 전에 학생의 실제 모습과 맞는지 꼭 확인하세요.</p>`;
}

function renderLayer() {
  const L = $("#layer");

  const s = S.sheet;

  if (s.type === "student") html = studentSheet(s);
  else if (s.type === "class") html = classSheet(s);
  else if (s.type === "manage") html = manageSheet(s);
  else if (s.type === "confirm") html = confirmSheet(s);
  else if (s.type === "copy") html = copySheet(s);

// 엑셀의 행/열 위치를 유지해 검증한 뒤 한 번에 저장합니다.
function bulkColumns(ev) {
  if (ev.id !== "g2a") return ev.items;
  return [{ id: "sex", short: "성별", kind: "sex", unit: "남/여" }, ev.items[0], { id: "tool", short: "도구", kind: "tool", unit: "배트/라켓" }, ev.items[1], { ...ev.items[2], short: "기능(초)" }];
}
function planBulk(c, ev, sid, itemId, text) {
  const students = c.students || [];
  const start = students.findIndex(st => st.id === sid);
  const columns = bulkColumns(ev);
  const col = columns.findIndex(it => it.id === itemId);
  if (start < 0 || col < 0) throw new Error("시작 학생과 항목을 선택해 주세요.");
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  if (lines[lines.length - 1] === "") lines.pop();
  if (!lines.some(line => line.trim())) throw new Error("엑셀에서 결과값을 복사해 붙여넣어 주세요.");
  if (lines.length > students.length - start) throw new Error("붙여넣은 행이 남은 학생 수보다 많아요.");
  const changes = [], rows = [];
  lines.forEach((line, ri) => {
    const cells = line.split("\t");
    if (cells.length > columns.length - col) throw new Error(`${ri + 1}행: 평가 항목 수보다 열이 많아요.`);
    const st = students[start + ri], en = entryOf(c, st.id, ev);
    cells.forEach((cell, ci) => {
      const it = columns[col + ci], value = cell.trim();
      if (!value) return;
      if (en && en.absent) { rows.push({ st, it, value, skip: true }); return; }
      if (it.kind === "sex") {
        const sex = { "남": "남", "여": "여", "남자": "남", "여자": "여" }[value];
        if (!sex) throw new Error(`${ri + 1}행 성별: 남 또는 여를 입력하세요.`);
        changes.push({ sid: st.id, sex });
        rows.push({ st, it, value, skip: false });
        return;
      }
      const targetId = it.kind === "tool" ? "hit" : it.id;
      const prior = changes.findLast(change => change.sid === st.id && change.itemId === targetId);
      const old = prior ? prior.patch : en && en.items && en.items[targetId];
      let patch;
      if (it.kind === "tool") {
        const v = { "배트": "bat", "라켓": "racket" }[value];
        if (!v) throw new Error(`${ri + 1}행 도구: 배트 또는 라켓을 입력하세요.`);
        patch = { ...(old || {}), v };
      } else if (it.kind === "level") {
        const p = /^\d+(?:\.\d+)?$/.test(value) ? Number(value) : NaN;
        if (!it.levels.some(([pt]) => pt === p)) throw new Error(`${ri + 1}행 ${it.short}: ${it.levels.map(([pt]) => pt).join(", ")}점 중 입력하세요.`);
        patch = { pts: p };
      } else {
        const parsed = parseRaw(it, value);
        if (parsed.err) throw new Error(`${ri + 1}행 ${it.short}: ${parsed.err}`);
        patch = { raw: parsed.v };
        if (it.variants) patch.v = varOf(it, old).id;
      }
      changes.push({ sid: st.id, itemId: targetId, patch });
      rows.push({ st, it, value, skip: false });
    });
  });
  if (!changes.length) throw new Error("적용할 값이 없어요. 빈칸과 미응시 학생은 건너뜁니다.");
  return { changes, rows };
}
function bulkSheet(s) {

    <div class="field"><label for="bulk-item">시작 항목</label><select id="bulk-item" class="txt">${bulkColumns(ev).map(it => `<option value="${it.id}" ${s.itemId === it.id ? "selected" : ""}>${esc(it.short)} (${it.kind === "level" ? "배점" : it.unit})</option>`).join("")}</select></div>

    <div id="bulk-preview" aria-live="polite">${preview}</div></div>
    <div class="sh-foot"><button class="btn" data-act="bulk-preview">미리보기</button><span class="sp"></span><button class="btn primary" id="bulk-apply" data-act="bulk-apply" ${s.plan ? "" : "disabled"}>확인 후 적용</button></div>`;
}

function studentSheet(s) {

  const st = studs[i]; if (!st) return "";
  const en = entryOf(c, st.id, ev);
  const t = evalTotal(c, st, ev);
  const absent = en && en.absent;
  const cards = ev.items.map(item => {
    const e = en && en.items && en.items[item.id];
    const p = itemPts(item, en, st);
    let inner = "";
    if (item.kind === "level") {
      inner = `<div class="ptsrow">${item.levels.map(([pt, l]) => `<button data-act="lv" data-sid="${st.id}" data-item="${item.id}" data-p="${pt}" aria-pressed="${e && e.pts === pt}">${pt} <span style="font-family:var(--f-body);font-weight:500;font-size:12px">${esc(l)}</span></button>`).join("")}</div>`;

          `<div class="ptsrow"><button data-act="mkundo" data-sid="${st.id}" data-item="${item.id}" ${ts.filled ? "" : "disabled"}>↶ 마지막 칸 지우기</button><button data-act="mkfill" data-sid="${st.id}" data-item="${item.id}" ${ts.filled && !ts.done ? "" : "disabled"}>남은 칸 모두 ×</button></div>`;

      } else {
        inner = head + `<div class="ptsrow"><input class="raw" style="width:140px" id="d-${item.id}" data-sid="${st.id}" data-item="${item.id}" value="${esc(e && !e.manual ? fmtRaw(item, e.raw) : "")}" placeholder="${item.unit}" inputmode="decimal" enterkeyhint="done" autocomplete="off" aria-label="${esc(item.name)} 기록"><span class="unit">${item.unit}</span></div>`;
      }

  }).join("");
  return `<div class="sh-head"><h3><span class="num">${esc(st.no)}번</span>${esc(st.name)}${st.sex ? `<span class="muted" style="font-size:13px">${esc(st.sex)}</span>` : ""}</h3>
      <button class="iconbtn" data-act="close">닫기</button></div>
    <div class="sh-body">
      <div class="card"><div class="ttl"><div><strong>${esc(ev.tag)} ${esc(ev.name)}</strong></div>

/* ───────── 명렬표 읽기 ───────── */
const HEADER = /^(번호|이름|성명|성별|학번|학년|반|비고|no\.?|name)$/i;
function parseRoster(text) {
  const out = [], seen = new Set();
  String(text).split(/\r?\n/).forEach(line => {
    const toks = line.split(/[\t,;|]+|\s+/).map(t => t.trim().replace(/^"|"$/g, "")).filter(Boolean);
    if (!toks.length || toks.every(t => HEADER.test(t))) return;
    let no = null, name = null, sex = null;
    for (const t of toks) {
      if (HEADER.test(t)) continue;
      if (/^(남|남자|M|m|male)$/.test(t)) { sex = "남"; continue; }
      if (/^(여|여자|F|f|female)$/.test(t)) { sex = "여"; continue; }
      if (/^\d{4,5}$/.test(t)) { no = +t.slice(-2); continue; }
      if (/^\d{1,2}$/.test(t)) { no = +t; continue; }
      if (!name && /^[가-힣A-Za-z][가-힣A-Za-z·.\-]{0,19}$/.test(t)) name = t;
    }
    if (!name) return;
    if (no == null) no = out.length + 1;
    const key = no + "|" + name;
    if (seen.has(key)) return; seen.add(key);
    out.push({ no, name, sex });
  });
  return out.sort((a, b) => a.no - b.no);
}
let xlsxLoading = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxLoading = xlsxLoading || new Promise((ok, bad) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = () => ok(window.XLSX); s.onerror = () => { xlsxLoading = null; bad(new Error("load")); };
    document.head.appendChild(s);
  });
}
async function readRosterFile(file) {
  if (/\.(xlsx|xls)$/i.test(file.name)) {
    const X = await loadXLSX();
    const wb = X.read(await file.arrayBuffer(), { type: "array" });
    return X.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]], { FS: "\t" });
  }
  return await file.text();
}

/* ───────── 내보내기 ───────── */
function tableRows(c) {
  const evs = evalsOf(c);
  const head = ["반", "번호", "이름", "성별"];
  evs.forEach(ev => { ev.items.forEach(it => { if (it.kind === "num") head.push(`${ev.tag} ${it.short} 기록`); head.push(`${ev.tag} ${it.short}(${it.max})`); }); head.push(`${ev.tag} 합계(${ev.max})`); });
  head.push("학기 합계(100)", "성취도");
  const rows = (c.students || []).map(st => {
    const r = [c.name, st.no, st.name, st.sex || ""];
    evs.forEach(ev => {
      const en = entryOf(c, st.id, ev); const t = evalTotal(c, st, ev);
      ev.items.forEach(it => {
        const e = en && en.items && en.items[it.id];
        let rec = "";
        if (t.absent) rec = "미응시";
        else if (e && e.manual) rec = "직접";
        else if (e && it.trials && Array.isArray(e.marks)) { const ts = trialStat(it, e); rec = `${ts.succ}/${ts.n} ${ts.marks.map(x => x === 1 ? "○" : x === 0 ? "×" : "·").join("")}`; }
        else if (e && e.raw != null) rec = fmtRaw(it, e.raw);
        if (rec && it.variants && e && !t.absent) rec += `(${varOf(it, e).label})`;
        if (it.kind === "num") r.push(rec);
        const p = t.absent ? "" : itemPts(it, en, st); r.push(p == null ? "" : p);
      });
      r.push(t.done ? t.total : "");
    });
    const sem = semester(c, st); r.push(sem ? sem.total : "", sem ? sem.grade : "");
    return r;
  });
  return [head, rows];
}
const csvCell = v => { v = String(v ?? ""); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
async function saveFile(filename, data) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch {}
  if (dl) {
    try { await dl.save({ filename, data }); toast("파일을 저장했어요."); }
    catch (e) { if (e && e.code !== "declined") toast("파일을 저장하지 못했어요."); }
    return;
  }
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data], { type: "text/plain;charset=utf-8" }));
    a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  } catch { toast("이 화면에서는 파일 저장이 안 돼요. ‘표 복사’를 쓰세요."); }
}
function exportCSV(list, filename) {
  let lines = [];
  list.forEach((c, i) => { const [h, rows] = tableRows(c); if (i === 0 || evalsOf(c) !== evalsOf(list[i - 1])) { if (i) lines.push(""); lines.push(h.map(csvCell).join(",")); } rows.forEach(r => lines.push(r.map(csvCell).join(","))); });
  saveFile(filename, "﻿" + lines.join("\r\n"));
}

let toastT;
function toast(msg) {
  let t = $("#toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ───────── 동작 ───────── */
function updateRowPts(c, ev, item, st) {
  const en = entryOf(c, st.id, ev); const p = itemPts(item, en, st);
  for (const id of ["pt-" + st.id, "dp-" + item.id]) {
    const el = document.getElementById(id); if (!el) continue;
    if (id.startsWith("dp-") && (!S.sheet || S.sheet.sid !== st.id)) continue;
    el.className = p == null ? "pts" : p === item.max ? "pts full" : "pts on";
    el.textContent = p == null ? "–" : p;
  }
}
function commitInput(el) {
  const c = cls(); if (!c) return false;
  const ev = curEval(c); const item = ev.items.find(i => i.id === el.dataset.item);
  const st = (c.students || []).find(s => s.id === el.dataset.sid);
  if (!item || !st) return false;
  const r = parseRaw(item, el.value);
  if (r.err) { el.classList.add("bad"); toast(`${st.name}: ${r.err}`); return false; }
  el.classList.remove("bad");
  const en = entryOf(c, st.id, ev); const old = en && en.items && en.items[item.id];
  if (r.empty) { if (old && !old.manual) setItem(c, st.id, ev, item.id, null); }
  else {
    const patch = { raw: r.v };
    if (item.variants) patch.v = varOf(item, old).id;
    if (!old || old.raw !== r.v || old.manual || old.v !== patch.v) setItem(c, st.id, ev, item.id, patch);
  }
  return true;
}

document.addEventListener("input", e => {
  const el = e.target;
  if (el.classList && el.classList.contains("raw")) {
    const c = cls(); if (!c) return;
    const ev = curEval(c); const item = ev.items.find(i => i.id === el.dataset.item);
    const st = (c.students || []).find(s => s.id === el.dataset.sid);
    const r = parseRaw(item, el.value);
    el.classList.toggle("bad", !!r.err);
    const target = el.id.startsWith("d-") ? document.getElementById("dp-" + item.id) : document.getElementById("pt-" + st.id);
    if (target) {
      let p = null;
      if (r.v != null && !(item.bySex && !st.sex)) p = item.variants ? varOf(item, (entryOf(c, st.id, ev)?.items || {})[item.id]).rule(r.v) : item.rule(r.v, { sex: st.sex });
      target.className = p == null ? "pts" : p === item.max ? "pts full" : "pts on";
      target.textContent = p == null ? "–" : p;
    }
  } else if (el.id && el.id.startsWith("rm-")) {
    const c = cls(); if (!c) return;
    const sid = el.dataset.sid;
    const st = (c.students || []).find(s => s.id === sid); if (!st) return;
    c.remarks = c.remarks || {};
    c.remarks[sid] = { ...(c.remarks[sid] || {}), auto: false, text: el.value, sig: sigOf(c, st) };
    persist(c.id);
    const cnt = document.getElementById("rc-" + sid);
    if (cnt) { const k = countText(el.value); cnt.textContent = k.html; cnt.className = k.cls; }
  } else if (el.id && el.id.startsWith("mm-")) {
    const c = cls(); if (!c) return;
    const sid = el.dataset.sid;
    const st = (c.students || []).find(s => s.id === sid); if (!st) return;
    c.remarks = c.remarks || {};
    const rm = c.remarks[sid] = { ...(c.remarks[sid] || {}), memo: el.value };
    persist(c.id);
    if (!isEdited(rm)) {
      const text = assemble(rm.parts, rm.memo);
      const ta = document.getElementById("rm-" + sid); if (ta) ta.value = text;
      const cnt = document.getElementById("rc-" + sid); if (cnt) { const k = countText(text); cnt.textContent = k.html; cnt.className = k.cls; }
    }
  } else if (el.id === "f-text" && S.sheet) {
    S.sheet.text = el.value;
    const pv = $("#f-prev"); if (pv) pv.innerHTML = previewText(parseRoster(el.value));
  }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.classList && el.classList.contains("raw")) { if (commitInput(el) && el.id.startsWith("d-")) render(); else if (!el.id.startsWith("d-")) refreshProgress(); return; }
  if (el.id && el.id.startsWith("tk-")) {
    const t = (S.tasks.items || []).find(x => x.id === el.dataset.tid); if (!t) return;
    t.done = el.checked; t.doneAt = el.checked ? Date.now() : null;
    persist(TASKS); render(); toast(el.checked ? "완료한 업무로 옮겼어요." : "진행중으로 되돌렸어요."); return;
  }
  if (el.id === "absent") { const c = cls(); setAbsent(c, el.dataset.sid, curEval(c), el.checked); render(); return; }
  if (el.id === "f-grade" && S.sheet) { S.sheet.grade = +el.value; render(); return; }
  if (el.id === "f-num" && S.sheet) { S.sheet.num = +el.value; return; }
  if (el.id === "f-file" && el.files[0] && S.sheet) {
    try { S.sheet.text = (await readRosterFile(el.files[0])).replace(/\t+$/gm, ""); render(); }
    catch { toast("파일을 읽지 못했어요. 엑셀에서 복사해 붙여넣어 주세요."); }
    return;
  }
  if (el.id === "f-restore" && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      const list = Array.isArray(data.classes) ? data.classes : [];
      const tk = data.tasks && Array.isArray(data.tasks.items) ? data.tasks.items : [];
      if (!list.length && !tk.length) throw 0;
      list.forEach(k => { if (k && k.id && EVALS[k.grade]) { S.classes[k.id] = k; persist(k.id); } });
      if (tk.length) {
        const have = new Set((S.tasks.items || []).map(x => x.id));
        S.tasks.items = (S.tasks.items || []).concat(tk.filter(x => x && x.id && !have.has(x.id)));
        persist(TASKS);
      }
      S.sheet = null; toast(`반 ${list.length}개, 업무 ${tk.length}건을 불러왔어요.`); render();
    } catch { toast("백업 파일 형식이 아니에요."); }
  }
});
function refreshProgress() {
  // 진행률·행 표시만 다시 그리기 (포커스 유지)
  const c = cls(); if (!c) return;
  const ev = curEval(c); const cur = S.ui.item[ev.id];
  const item = ev.items.find(i => i.id === cur); if (!item) return;
  const prog = document.querySelector(".progress"); if (!prog) return;
  const studs = c.students || [];
  const done = studs.filter(st => { const en = entryOf(c, st.id, ev); return (en && en.absent) || itemPts(item, en, st) != null; }).length;
  const pct = studs.length ? Math.round(done / studs.length * 100) : 0;
  prog.querySelector("b").textContent = done; prog.querySelector(".bar i").style.width = pct + "%";
}
document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key === "Enter" && el.classList && el.classList.contains("raw")) {
    e.preventDefault();
    if (!commitInput(el)) return;
    if (el.id.startsWith("in-")) {
      refreshProgress();
      const all = [...document.querySelectorAll("input.raw[id^='in-']")];
      const nx = all[all.indexOf(el) + 1];
      if (nx) { nx.focus(); nx.select(); nx.scrollIntoView({ block: "center", behavior: "smooth" }); } else el.blur();
    } else { el.blur(); render(); }
  }
  if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
});

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const act = t.dataset.act;
  if (act === "scrim") { if (e.target === t && S.sheet && S.sheet.type !== "confirm") { S.sheet = null; render(); } return; }
  const c = cls();
  const ev = c && curEval(c);
  const st = c && t.dataset.sid ? (c.students || []).find(s => s.id === t.dataset.sid) : null;
  const item = ev && t.dataset.item ? ev.items.find(i => i.id === t.dataset.item) : null;
  switch (act) {
    case "bulk-open": {
      if (!c || !(c.students || []).length) { toast("먼저 반 관리에서 학생을 추가해 주세요."); break; }
      S.sheet = { type: "bulk", sid: c.students[0].id, itemId: ev.id === "g2a" ? "sex" : t.dataset.item || ev.items[0].id, text: "" };
      renderLayer(); break;
    }
    case "bulk-preview": {
      const s = S.sheet;
      s.sid = $("#bulk-student").value; s.itemId = $("#bulk-item").value; s.text = $("#bulk-text").value;
      try { s.plan = planBulk(c, ev, s.sid, s.itemId, s.text); renderLayer(); }
      catch (err) { invalidateBulk(); toast(err.message); }
      break;
    }
    case "bulk-apply": {
      const s = S.sheet;
      if (!s || !s.plan) break;
      try {
        const plan = planBulk(c, ev, s.sid, s.itemId, s.text);
        c.scores = c.scores || {};
        for (const change of plan.changes) {
          if (change.sex) {
            c.students.find(st => st.id === change.sid).sex = change.sex;
            continue;
          }
          const scores = c.scores[change.sid] = c.scores[change.sid] || {};
          const en = scores[ev.id] = scores[ev.id] || { items: {} };
          en.items = en.items || {}; en.items[change.itemId] = change.patch;
        }
        c.updated = Date.now(); persist(c.id); S.sheet = null; render();
        toast(`${plan.changes.length}개 결과값을 적용했어요.`);
      } catch (err) { invalidateBulk(); toast(err.message); }
      break;
    }
    case "page": S.ui.page = t.dataset.id; saveUI(); render(); window.scrollTo({ top: 0 }); break;
    case "ttab": S.ui.ttab = t.dataset.id; saveUI(); render(); break;
    case "task-add": {
      const text = ($("#t-text").value || "").trim();
      if (!text) { toast("업무내용을 적어 주세요."); $("#t-text").focus(); break; }
      S.tasks.items = S.tasks.items || [];
      S.tasks.items.push({ id: rid(), date: $("#t-date").value || today(), due: $("#t-due").value || "", text, done: false, doneAt: null, created: Date.now() });
      persist(TASKS); S.ui.ttab = "open"; saveUI(); render(); toast("업무를 추가했어요."); break;
    }
    case "task-edit": S.sheet = { type: "task", tid: t.dataset.tid }; render(); break;
    case "task-save": {
      const tk = S.tasks.items.find(x => x.id === t.dataset.tid); if (!tk) break;
      const text = ($("#e-text").value || "").trim();

      persist(TASKS); S.sheet = null; render(); toast("업무를 수정했어요."); break;
    }

      break;

      S.mode = "local"; S.classes = ls.get(LS_DATA) || {}; S.tasks = ls.get(LS_TASKS) || { items: [] }; S.saveErr = null;

      break;

    case "rm-copy": {
